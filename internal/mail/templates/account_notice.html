<!DOCTYPE html>
<html lang="id">
<head>
<title>{{.Title}}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; border-collapse: collapse;">
 <tr>
 <td align="center" style="padding: 0 15px;">
 <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 500px; border-collapse: collapse;">
 <tr>
 <td style="padding: 20px 0 30px 0;">
 <table border="0" cellpadding="0" cellspacing="0" width="100%">
 <tr>
 <td align="left"><a href="https://salmanitb.com/" target="_blank"><img alt="Salman ITB" src="https://mosfeed.id/assets/collections/photo/large/logo-salman-png-fc-1-01-614af1ef5012f.png" width="150" height="78" style="display: block; border: 0;"></a></td>
 <td align="right"><a href="https://kaderisasi.salmanitb.com/" target="_blank"><img alt="Kaderisasi Salman" src="https://oczmkz.stripocdn.email/content/guids/CABINET_cd7655c6f5dccf19bd555ba4197657dc/images/31301603339209194.png" width="150" height="78" style="display: block; border: 0;"></a></td>
 </tr>
 </table>
 </td>
 </tr>
 <tr>
 <td align="center" style="font-size: 24px; font-family: Helvetica, Arial, sans-serif; color: #333333; padding-top: 10px;">{{.Heading}}</td>
 </tr>
 {{range .Paragraphs}}
 <tr>
 <td align="center" style="padding: 16px 0 0 0; font-size: 16px; line-height: 25px; font-family: Helvetica, Arial, sans-serif; color: #666666;">{{.}}</td>
 </tr>
 {{end}}
 {{if .Code}}
 <tr>
 <td align="center" style="padding: 25px 0 0 0;">
 <span style="display: inline-block; font-size: 32px; letter-spacing: 8px; font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #333333; background-color: #f2f4f7; padding: 12px 24px; border-radius: 4px;">{{.Code}}</span>
 </td>
 </tr>
 {{end}}
 {{if .ButtonURL}}
 <tr>
 <td align="center" style="padding: 25px 0 0 0;">
 <a href="{{.ButtonURL}}" target="_blank" style="font-size: 16px; font-family: Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; background-color: #5D9CEC; border-top: 15px solid #5D9CEC; border-bottom: 15px solid #5D9CEC; border-left: 25px solid #5D9CEC; border-right: 25px solid #5D9CEC; border-radius: 3px; display: inline-block;">{{.ButtonLabel}} &rarr;</a>
 </td>
 </tr>
 {{end}}
 {{if .Footnote}}
 <tr>
 <td align="center" style="padding: 30px 0 0 0; font-size: 13px; line-height: 20px; font-family: Helvetica, Arial, sans-serif; color: #999999;">{{.Footnote}}</td>
 </tr>
 {{end}}
 <tr>
 <td align="center" style="padding: 40px 0 20px 0; font-size: 12px; line-height: 18px; font-family: Helvetica, Arial, sans-serif; color: #666666;">
 Salman ITB ~ <a href="https://salmanitb.com/" style="color: #666666;">Official Website</a><br>Bidang Kemahasiswaan, Kaderisasi dan Alumni &nbsp;|&nbsp; <a href="https://kaderisasi.salmanitb.com/" style="color: #666666; text-decoration: none;">BMKA</a>
 </td>
 </tr>
 </table>
 </td>
 </tr>
</table>
</body>
</html>
